# Идентификатор фильтра, который попадет в CSV/Parquet и карточки решений.
filter_id: F-001

# Сценарий генерации данных.
# Доступные варианты описаны в src/simulator/config.py:
# normal, slow_clogging, rapid_clogging, flow_spikes,
# sensor_bias, sensor_stuck, missing_data, maintenance_reset.
scenario_name: slow_clogging

# Начало временного ряда. Часовой пояс важен для timestamp в выходных файлах.
start_time: "2026-01-01T00:00:00+03:00"

# Длительность симуляции в сутках.
duration_days: 90

# Шаг дискретизации временного ряда в минутах.
# При 90 днях и шаге 5 минут получается 25920 строк.
step_minutes: 5

# Seed генератора случайных чисел. Нужен для воспроизводимости одного и того же сценария.
seed: 42


# -----------------------------
# Расход газа Q
# -----------------------------

# Номинальный расход, относительно которого нормируется deltaP.
q_nominal_m3h: 600

# Минимальный допустимый расход в профиле режима.
q_min_m3h: 150

# Максимальный допустимый расход в профиле режима.
q_max_m3h: 1200

# Амплитуда суточных колебаний расхода относительно номинального уровня.
# Чем больше значение, тем сильнее режимные колебания deltaP.
a_q: 0.12

# Амплитуда недельных колебаний расхода.
q_weekly_amp: 0.05


# -----------------------------
# Входное давление P_in
# -----------------------------

# Номинальное входное давление.
p_in_nominal_mpa: 0.60

# Минимальное физически допустимое давление.
# В гибридных правилах низкое P_out может привести к shutdown_request.
p_min_mpa: 0.10

# Максимальное физически допустимое давление.
p_max_mpa: 1.20

# Амплитуда колебаний входного давления.
a_p_mpa: 0.015


# -----------------------------
# Температура газа T
# -----------------------------

# Номинальная температура. Используется в расчете плотности и вязкостного фактора.
t_nominal_c: 15

# Нижняя граница температуры в профиле.
t_min_c: -30

# Верхняя граница температуры в профиле.
t_max_c: 50

# Амплитуда температурных колебаний.
a_t_c: 4


# -----------------------------
# Перепад давления, состояния и RUL
# -----------------------------

# Базовый перепад давления на чистом фильтре при номинальном расходе.
dp0_kpa: 1.2

# Порог предупредительного состояния по нормированному перепаду deltaP_norm.
dp_warn_kpa: 5.0

# Порог критического состояния по нормированному перепаду deltaP_norm.
dp_crit_kpa: 10.0

# Плановый горизонт обслуживания в часах.
# Если итоговый RUL ниже этого значения, правила могут назначить planned_maintenance.
planned_maintenance_rul_h: 200

# Срочный горизонт обслуживания в часах.
# Если итоговый RUL ниже этого значения, правила могут назначить urgent_maintenance.
urgent_maintenance_rul_h: 100

# -----------------------------
# Деградация фильтра
# -----------------------------

# Начальный скрытый уровень засорения.
# 0 - чистый фильтр, 1 - максимально засоренный.
c0: 0.05

# Базовая скорость роста засорения в час.
# Чем выше значение, тем быстрее фильтр дойдет до warning/critical.
k_s_per_hour: 0.00045

# Степень влияния расхода на перепад давления.
# Для турбулентного режима часто используется значение около 2.
alpha_flow: 2.0

# Степень влияния расхода на скорость накопления засорения.
# 1.0 означает линейную зависимость скорости деградации от нагрузки по расходу.
gamma_load: 1.0

# Коэффициент влияния засорения на сопротивление фильтра.
# Чем больше значение, тем сильнее clog_level увеличивает deltaP.
k_c: 8.0

# Нелинейность влияния засорения на сопротивление.
# 1.0 означает линейное влияние clog_level.
beta: 1.0

# Температурный коэффициент вязкостного/плотностного эффекта.
# Используется в физической модели перепада давления.
k_mu_per_c: 0.0025


# -----------------------------
# Шумы датчиков
# -----------------------------

# Стандартное отклонение шума датчиков давления, МПа.
sigma_p_mpa: 0.0003

# Относительный шум датчика расхода.
# 0.01 означает примерно 1% шума.
sigma_q_rel: 0.01

# Абсолютный шум датчика температуры, градусы Цельсия.
sigma_t_abs_c: 0.3

# -----------------------------
# Дефекты и качество данных
# -----------------------------

# Вероятность пропуска по каждому наблюдаемому каналу на каждом шаге.
p_missing: 0.005

# Вероятность кратковременного выброса датчика.
p_spike: 0.001

# Вероятность начала залипания датчика.
p_stuck: 0.0005

# Дрейф давления в МПа за сутки.
# 0.0 означает, что систематического смещения датчика нет.
bias_drift_mpa_per_day: 0.0
