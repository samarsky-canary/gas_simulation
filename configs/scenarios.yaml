# Набор сценариев для пакетного запуска или сравнительных экспериментов.
#
# Каждый блок верхнего уровня - это имя сценария в списке экспериментов.
# Поле scenario_name должно совпадать с одним из допустимых ScenarioName
# в src/simulator/config.py.
#
# Здесь задаются только параметры, которые отличаются от базовой конфигурации.
# Остальные значения берутся из defaults/SCENARIO_OVERRIDES и base.yaml,
# в зависимости от того, какой код запуска использует этот файл.


# Нормальный режим эксплуатации.
# Фильтр почти не засоряется, дефектов данных мало.
# Нужен как контрольный "здоровый" сценарий.
normal:
  # Имя встроенного сценария. Для normal в config.py дополнительно снижена скорость деградации.
  scenario_name: normal

  # Длительность 30 дней достаточна, потому что критического засорения здесь не ожидается.
  duration_days: 30


# Базовый сценарий постепенного засорения.
# Используется как основной сценарий для демонстрации деградации, RUL и переходов состояния.
slow_clogging:
  # Встроенный сценарий медленного накопления засорения.
  scenario_name: slow_clogging

  # Длительный горизонт нужен, чтобы фильтр успел пройти normal -> warning -> critical.
  duration_days: 90


# Ускоренное засорение.
# Нужен для проверки, как правила и модели реагируют на быстрое ухудшение фильтра.
rapid_clogging:
  # В config.py для rapid_clogging повышается скорость деградации и амплитуда расхода.
  scenario_name: rapid_clogging

  # Горизонт короче, потому что критическое состояние наступает быстрее.
  duration_days: 45


# Сценарий со скачками расхода.
# Нужен, чтобы показать отличие сырого deltaP от нормированного deltaP_norm.
flow_spikes:
  # В config.py для flow_spikes повышается вероятность выбросов и шум расхода.
  scenario_name: flow_spikes

  # 30 дней достаточно для проверки влияния режимных скачков на перепад давления.
  duration_days: 30
